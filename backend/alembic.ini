# Alembic configuration for the Lumina backend. The database URL comes from the application settings
# (DATABASE_URL in .env / the environment), never from this file. The app applies migrations itself at startup
# (app/database/migrations.py); the CLI is for creating and inspecting revisions, e.g. from backend/:
#   alembic current            alembic history            alembic revision --autogenerate -m "describe change"

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
