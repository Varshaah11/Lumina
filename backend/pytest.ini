[pytest]
# Only the real test suite. backend/scripts/ holds manual/legacy scripts (some touch the real database);
# venv/ and models/ must never be walked.
testpaths = tests
norecursedirs = venv scripts models .git __pycache__
# Unknown markers are errors, so typos cannot silently deselect tests.
# The cache plugin is off so test runs leave no .pytest_cache directory in the working tree.
# Integration tests are deselected by default; run them explicitly with:  pytest -m integration
addopts = --strict-markers -p no:cacheprovider -m "not integration"
markers =
    integration: needs real external services (Ollama, Kokoro model files); deselected by default, run with -m integration
